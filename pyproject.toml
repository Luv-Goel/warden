[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-fim"
version = "0.1.0"
description = "File integrity monitor — tripwire-lite with SHA256 manifests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["warden*"]
